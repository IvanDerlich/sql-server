services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: dbgate
    ports:
      - "${CLIENT_PORT}:3000"     
    env_file:
      - .env
    volumes:
      - client_data:/root/.dbgate
    networks:
      - um-base-de-datos-sqlserver

  mssql:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: mssql
    ports:
      - "${SQLSERVER_PORT}:1433"
    env_file:
      - .env
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - um-base-de-datos-sqlserver

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.cli-tool
    env_file:
      - .env
    command: >
      bash -lc "
      until sqlcmd -S mssql,1433 -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\"; do
        echo 'Waiting for SQL Server...';
        sleep 2;
      done;
      sqlcmd -S mssql,1433 -U sa -P \"$MSSQL_SA_PASSWORD\" -C
      -v APP_DB_NAME=\"$APP_DB_NAME\" APP_DB_USER=\"$APP_DB_USER\" APP_DB_PASSWORD=\"$APP_DB_PASSWORD\"
      -i /scripts/01-init.sql;
      sqlcmd -S mssql,1433 -U sa -P \"$MSSQL_SA_PASSWORD\" -C
      -v APP_DB_NAME=\"$APP_DB_NAME\"
      -i /scripts/02-seed.sql
      "
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"
    profiles:
      - init
    networks:
      - um-base-de-datos-sqlserver

  cli-tool:
    build:
      context: .
      dockerfile: Dockerfile.cli-tool
    container_name: cli-tool
    env_file:
      - .env
    command: sleep infinity
    stdin_open: true
    tty: true
    networks:
      - um-base-de-datos-sqlserver

networks:
  um-base-de-datos-sqlserver:
    driver: bridge

volumes:
  client_data:
  mssql_data: